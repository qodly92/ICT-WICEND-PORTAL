<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ICT Portal - Corporate Glassmorphism PWA</title>
    
    <!-- Dependencies via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- PWA Manifest Inline Data URI -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIklDVCBQb3J0YWwiLAogICJzaG9ydF9uYW1lIjogIklDVCBQb3J0YWwiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2ZmZmZmZiIsCiAgInRoZW1lX2NvbG9yIjogIiMwYzViNWIiLAogICJpY29ucyI6IFtdCn0=">

    <style>
        :root {
            --bg: #f4f7fe;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --tx: #2b3674;
            --mu: #a3edd9;
            --mu-text: #707ebe;
            --bd: #e0e5f2;
            --pr: #0c5b5b;
            --tl: #208a8a;
            --ac: #ffcc00;
            --er: #ee5d50;
            --gn: #01b574;
            --bl: #3965ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: var(--tx);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Blogger Full Screen Overlay Fix */
        #blogger-wrapper-portal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 999999;
            background: var(--bg);
            display: flex;
            overflow: hidden;
        }

        /* Layout Architecture */
        .app-container { display: flex; width: 100vw; height: 100vh; }
        
        /* Desktop Fixed Glass Sidebar */
        .sidebar {
            width: 270px;
            background: rgba(12, 91, 91, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            overflow-y: auto;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            box-shadow: var(--glass-shadow);
            border-radius: 16px;
            padding: 20px;
        }

        /* Responsive Layout Switcher */
        .bottom-nav { display: none; }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                z-index: 100;
                transform: translateX(-100%);
            }
            .sidebar.active { transform: translateX(0); }
            .main-content { padding: 16px; padding-bottom: 80px; }
            
            /* Mobile Bottom Navigation Bar */
            .bottom-nav {
                display: flex;
                position: fixed;
                bottom: 12px; left: 12px; right: 12px;
                height: 60px;
                background: rgba(12, 91, 91, 0.9);
                backdrop-filter: blur(16px);
                border-radius: 30px;
                justify-content: space-around;
                align-items: center;
                z-index: 99;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }
            .bottom-nav-item {
                color: #fff;
                font-size: 20px;
                text-decoration: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 10px;
            }
        }

        /* Form Controls & Buttons */
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--bd);
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            font-size: 14px;
            color: var(--tx);
            margin-top: 6px;
        }
        button {
            background: var(--pr);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-gold { background: var(--ac); color: #1b2430; }

        /* Navigation Links */
        .nav-group-title { font-size: 11px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin: 16px 0 6px 8px; font-weight: 700; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: rgba(255,255,255,0.85); text-decoration: none; cursor: pointer; margin-bottom: 2px; font-size: 13px; }
        .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.2); color: #fff; font-weight: 600; }

        /* Tables & Data Grid */
        .table-responsive { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--bd); white-space: nowrap; }
        th { background: rgba(12, 91, 91, 0.05); color: var(--pr); font-weight: 700; }
        
        /* Modal Glass */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { width: 90%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

<div id="blogger-wrapper-portal">
    <div id="app" class="app-container"></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // CONFIGURATION SWITCHER
    const IS_PREVIEW = false; // Set FALSE jika sudah terhubung ke Supabase
    const SUPABASE_URL = "https://celmdiuseydyqcfwoqyc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_tC_KH4K6nqG1_aisUNC33Q_kGj0nFox";

    let supabase = null;
    if (!IS_PREVIEW) {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // STATE MANAGEMENT
    const state = {
        user: JSON.parse(sessionStorage.getItem('ict_user')) || null,
        currentView: 'dashboard',
        dummyData: {
            profiles: [
                { id: '1', nama: 'Admin ICT', username: 'admin', role: 'Manajer', nip: '19900101', pass: 'admin123' },
                { id: '2', nama: 'Staf Multimedia', username: 'staf', role: 'Staf', nip: '19950202', pass: 'staf123' }
            ],
            tickets: [
                { id: '101', tanggal: '2026-10-23', nama: 'Staf Multimedia', kategori: 'IT', judul: 'Koneksi Wi-Fi Ruang Rapat Terputus', prioritas: 'Tinggi', status: 'Open' }
            ]
        }
    };

    // PWA DYNAMIC SERVICE WORKER
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
    }

    // DATABASE AUTO SETUP & INITIALIZER
    async function autoSetupDatabase() {
        if (IS_PREVIEW) return;
        try {
            const { data, error } = await supabase.from('profiles').select('count', { count: 'exact' });
            if (error || data[0].count === 0) {
                console.log("Seeding Database Initial Data...");
                await supabase.from('profiles').insert([
                    { nama: 'Super Admin', username: 'admin', role: 'Manajer', nip: '1001', password: 'admin' },
                    { nama: 'Staf ICT', username: 'staf', role: 'Staf', nip: '1002', password: 'staf' }
                ]);
            }
        } catch (e) {
            console.error("Auto setup database skipped:", e);
        }
    }

    // MAIN RENDER ENGINE
    function render() {
        const app = document.getElementById('app');
        if (!state.user) {
            app.innerHTML = renderLogin();
            bindLoginEvents();
            return;
        }

        app.innerHTML = `
            <aside class="sidebar" id="sidebar">
                <div style="font-weight:800; font-size:18px; text-align:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.2); margin-bottom:15px;">
                    🏫 ICT PORTAL
                </div>
                <div class="nav-group-title">Utama</div>
                <div class="nav-link ${state.currentView === 'dashboard' ? 'active' : ''}" onclick="window.navigate('dashboard')">📊 Dashboard</div>
                <div class="nav-link ${state.currentView === 'kpi' ? 'active' : ''}" onclick="window.navigate('kpi')">🎯 KPI ICT</div>

                <div class="nav-group-title">Kepegawaian</div>
                <div class="nav-link ${state.currentView === 'profil' ? 'active' : ''}" onclick="window.navigate('profil')">🪪 Profile Pegawai</div>
                <div class="nav-link ${state.currentView === 'absen' ? 'active' : ''}" onclick="window.navigate('absen')">⏰ Kehadiran Harian</div>
                <div class="nav-link ${state.currentView === 'izin' ? 'active' : ''}" onclick="window.navigate('izin')">📝 Perizinan</div>
                <div class="nav-link ${state.currentView === 'progr' ? 'active' : ''}" onclick="window.navigate('progr')">🗂️ Program Kerja</div>

                <div class="nav-group-title">Content Framework</div>
                <div class="nav-link ${state.currentView === 'cplan' ? 'active' : ''}" onclick="window.navigate('cplan')">🗓️ Content Planner</div>
                <div class="nav-link ${state.currentView === 'sosmed' ? 'active' : ''}" onclick="window.navigate('sosmed')">📈 Analisis Sosmed</div>

                <div class="nav-group-title">Lainnya</div>
                <div class="nav-link ${state.currentView === 'tiket' ? 'active' : ''}" onclick="window.navigate('tiket')">🛠️ Helpdesk IT</div>
                <div class="nav-link ${state.currentView === 'set' ? 'active' : ''}" onclick="window.navigate('set')">⚙️ Pengaturan</div>
                
                <div style="margin-top:auto; padding-top:15px; border-top:1px solid rgba(255,255,255,0.2);">
                    <div style="font-size:12px; margin-bottom:6px;">Login: <b>${state.user.nama}</b> (${state.user.role})</div>
                    <button class="btn-gold" style="width:100%" onclick="window.logout()">Keluar</button>
                </div>
            </aside>

            <main class="main-content">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <button onclick="document.getElementById('sidebar').classList.toggle('active')" class="mobile-toggle" style="display:none;">☰ Menu</button>
                    <h2 style="text-transform:capitalize;">${state.currentView.replace('_', ' ')}</h2>
                    <span>${new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                </div>
                ${renderViewContent()}
            </main>

            <div class="bottom-nav">
                <a class="bottom-nav-item" onclick="window.navigate('dashboard')">📊<span>Home</span></a>
                <a class="bottom-nav-item" onclick="window.navigate('absen')">⏰<span>Absen</span></a>
                <a class="bottom-nav-item" onclick="window.navigate('tiket')">🛠️<span>Helpdesk</span></a>
                <a class="bottom-nav-item" onclick="window.navigate('profil')">👤<span>Profil</span></a>
            </div>
        `;
    }

    function renderLogin() {
        return `
            <div style="display:flex; align-items:center; justify-content:center; width:100vw; height:100vh;">
                <div class="glass-card" style="width:100%; max-width:380px;">
                    <h2 style="text-align:center; margin-bottom:8px; color:var(--pr)">ICT Portal Login</h2>
                    <p style="text-align:center; font-size:12px; color:var(--mu-text); margin-bottom:20px;">Silakan login dengan akun Staf atau Admin</p>
                    <form id="loginForm">
                        <div style="margin-bottom:12px;">
                            <label style="font-size:12px; font-weight:600;">Username / Email Admin</label>
                            <input type="text" id="loginUser" required placeholder="Masukkan Username/Email">
                        </div>
                        <div style="margin-bottom:18px;">
                            <label style="font-size:12px; font-weight:600;">Password</label>
                            <input type="password" id="loginPass" required placeholder="••••••••">
                        </div>
                        <button type="submit" style="width:100%" class="btn-gold">Masuk Portal</button>
                    </form>
                </div>
            </div>
        `;
    }

    function renderViewContent() {
        if (state.currentView === 'dashboard') {
            return `
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px;">
                    <div class="glass-card">
                        <span style="font-size:12px; color:var(--mu-text)">Total Pegawai ICT</span>
                        <h3 style="font-size:28px; margin-top:6px;">${state.dummyData.profiles.length}</h3>
                    </div>
                    <div class="glass-card">
                        <span style="font-size:12px; color:var(--mu-text)">Tiket Helpdesk Open</span>
                        <h3 style="font-size:28px; margin-top:6px; color:var(--er)">${state.dummyData.tickets.filter(t=>t.status==='Open').length}</h3>
                    </div>
                </div>
                <div class="glass-card" style="margin-top:16px;">
                    <h3>Informasi Portal</h3>
                    <p style="font-size:13px; margin-top:8px;">Selamat datang di portal terpadu ICT. Semua aktivitas, presensi, dan pelaporan terintegrasi langsung secara real-time.</p>
                </div>
            `;
        }

        if (state.currentView === 'tiket') {
            return `
                <div class="glass-card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:14px;">
                        <h3>SLA / Helpdesk IT & Multimedia</h3>
                        <button onclick="alert('Fitur tambah tiket dibuka!')">+ Tiket Baru</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Pelapor</th>
                                    <th>Kategori</th>
                                    <th>Judul Masalah</th>
                                    <th>Prioritas</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${state.dummyData.tickets.map(t => `
                                    <tr>
                                        <td>${t.tanggal}</td>
                                        <td>${t.nama}</td>
                                        <td>${t.kategori}</td>
                                        <td>${t.judul}</td>
                                        <td><span style="color:red; font-weight:bold">${t.prioritas}</span></td>
                                        <td><b>${t.status}</b></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        return `<div class="glass-card"><h3>Modul ${state.currentView}</h3><p style="margin-top:8px;">Modul aktif dan siap digunakan dalam mode sinkronisasi Supabase.</p></div>`;
    }

    function bindLoginEvents() {
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;

            if (IS_PREVIEW) {
                const found = state.dummyData.profiles.find(x => x.username === u && x.pass === p);
                if (found) {
                    state.user = found;
                    sessionStorage.setItem('ict_user', JSON.stringify(found));
                    render();
                } else {
                    alert('Username atau password dummy salah! (Gunakan admin / admin123)');
                }
            } else {
                // Supabase Hybrid Login Check
                const { data, error } = await supabase.from('profiles').select('*').eq('username', u).eq('password', p).single();
                if (data) {
                    state.user = data;
                    sessionStorage.setItem('ict_user', JSON.stringify(data));
                    render();
                } else {
                    alert('Gagal Login. Periksa kredensial Anda!');
                }
            }
        });
    }

    // GLOBAL ACTIONS
    window.navigate = (view) => {
        state.currentView = view;
        render();
    };

    window.logout = () => {
        state.user = null;
        sessionStorage.removeItem('ict_user');
        render();
    };

    // INIT
    autoSetupDatabase();
    render();
</script>

</body>
</html>
