return`<div class="tb"><button class="s ${lpv=='board'?'':'g'}" onclick="lpv='board';tab()">▦ Per Nama</button><button class="s ${lpv=='tbl'?'':'g'}" onclick="lpv='tbl';tab()">☰ Tabel</button>${names.map(n=>`<span class="tg" style="background:${uClr(n)};color:${tc(uClr(n))};border-color:${uClr(n)}">${e(n)}</span>`).join('')}</div>${names.length?`<div class="cg"><div class="cd" style="grid-column:1/-1"><b>Anggota — jumlah laporan per status</b><small class="mu"> · terbanyak: ${e(names[0])} (${T(nm[names[0]])})</small><div style="height:300px"><canvas id="lpc1"></canvas></div></div><div class="cd"><b>Komposisi status</b><div style="height:240px"><canvas id="lpc2"></canvas></div></div></div>`:''}`}
const lpTk=r=>{const done=LPH.includes(r.progres),dl0=r.deadline||r.tanggal,od=dl0&&dl0<today()&&!done,c=PGC[r.progres]||'#e5e7eb';return`<div class="tk" style="border-left:5px solid ${uClr(r.nama||'')}"><div>${e(r.uraian||r.hasil||'(tanpa uraian)')}</div><div class="tb" style="margin:6px 0 0"><span class="tg" style="${od?'background:#fee2e2;color:#b91c1c;border-color:#fecaca':''}">📅 ${e(String(r.tanggal||'').slice(5).replace('-','/'))}${r.waktu?' '+e(r.waktu):''}</span>${r.deadline?`<span class="tg" style="${od?'background:#fee2e2;color:#b91c1c;border-color:#fecaca':''}" title="Target / Deadline">⏰ ${e(String(r.deadline).slice(5).replace('-','/'))}</span>`:''}${(r.induk||(r.ulang&&r.ulang!='Tidak terulang'))?'<span class="tg" title="Berulang">↻</span>':''}${canEd(r)?`<select class="isel" style="background:${c};color:${tc(c)}" onchange="inl('${r.id}','progres',this.value)">${PGO.map(o=>`<option ${o==r.progres?'selected':''}>${o}</option>`).join('')}</select>`:`<span class="tg" style="background:${c};color:${tc(c)};border-color:${c}">${e(r.progres||'')}</span>`}${r.link?`<a href="${e(r.link)}" target="_blank" rel="noopener">🔗</a>`:''}${r.berkas?'📎':''}${r.cek?'✔':''}${canEd(r)?` <button class="s g" onclick="frm('${r.id}')">✎</button>`:''}</div></div>`};
function lpBoard(){const g={};view.forEach(r=>{const n=r.nama||'(Tanpa nama)';(g[n]=g[n]||[]).push(r)});const act=n=>g[n].filter(r=>!LPH.includes(r.progres)).length,names=Object.keys(g).sort((a,b)=>act(b)-act(a)||a.localeCompare(b));window._lpn=names;if(!names.length)return'<p class="mu">Belum ada laporan pada filter ini.</p>';
