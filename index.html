function abx(){const t=today(),r=getD(L).find(x=>x.tanggal==t&&x.nama==me.nama);return`<div class="cd"><b>Jam kerja: masuk ${cfg.in} – pulang ${cfg.out}</b><p class="mu">Hari ini: masuk ${r&&r.masuk||'-'}, pulang ${r&&r.pulang||'-'}</p><div class="tb"><button onclick="clk('masuk')" ${r&&r.masuk?'disabled':''}>Absen Masuk</button><button class="g" onclick="clk('pulang')" ${!r||r.pulang?'disabled':''}>Absen Pulang</button></div>${isA()?`<div class="tb"><input placeholder="Scan barcode ID Card (alat scanner/ketik kode) lalu Enter" onkeydown="if(event.key=='Enter'){scan(this.value)}"></div>`:''}</div>`}
function clk(k,u){u=u||me;const h=new Date().toTimeString().slice(0,5),t=today();let d=getD(L),r=d.find(x=>x.tanggal==t&&x.nama==u.nama);if(k=='masuk'){if(r)return alert('Sudah absen masuk');d.push({id:uid(),tanggal:t,nama:u.nama,masuk:h,status:h>cfg.in?'Terlambat':'Tepat Waktu'});if(h>cfg.in)notify('@admin',`${u.nama} terlambat masuk (${h})`)}else if(r){r.pulang=h;if(h<cfg.out&&r.status=='Tepat Waktu')r.status='Pulang Awal'}setD(L,d);tab();badge()}
function scan(v){const c=v.trim().toUpperCase().replace(/\*/g,''),u=users.find(x=>codeOf(x)==c);if(!u)return alert('Kode tidak dikenal');const r=getD(L).find(x=>x.tanggal==today()&&x.nama==u.nama);clk(r&&r.masuk?'pulang':'masuk',u)}
const C39=Object.fromEntries('0:nnnwwnwnn 1:wnnwnnnnw 2:nnwwnnnnw 3:wnwwnnnnn 4:nnnwwnnnw 5:wnnwwnnnn 6:nnwwwnnnn 7:nnnwnnwnw 8:wnnwnnwnn 9:nnwwnnwnn A:wnnnnwnnw B:nnwnnwnnw C:wnwnnwnnn D:nnnnwwnnw E:wnnnwwnnn F:nnwnwwnnn G:nnnnnwwnw H:wnnnnwwnn I:nnwnnwwnn J:nnnnwwwnn K:wnnnnnnww L:nnwnnnnww M:wnwnnnnwn N:nnnnwnnww O:wnnnwnnwn P:nnwnwnnwn Q:nnnnnnwww R:wnnnnnwwn S:nnwnnnwwn T:nnnnwnwwn U:wwnnnnnnw V:nwwnnnnnw W:wwwnnnnnn X:nwnnwnnnw Y:wwnnwnnnn Z:nwwnwnnnn -:nwnnnnwnw .:wwnnnnwnn *:nwnnwnwnn'.split(' ').map(x=>[x[0],x.slice(2)]));
const codeOf=u=>String(u.nip||u.username||'').toUpperCase().replace(/[^0-9A-Z\-.]/g,'');
function bar(t){let x=10,h='';('*'+t+'*').split('').forEach(ch=>{const p=C39[ch];if(!p)return;for(let i=0;i<9;i++){const w=p[i]=='w'?3:1;if(i%2==0)h+=`<rect x="${x}" y="0" width="${w}" height="46" fill="#000"/>`;x+=w}x+=1});return`<svg viewBox="0 0 ${x+10} 46" style="width:100%;height:50px;background:#fff" preserveAspectRatio="none">${h}</svg>`}
function idc(id){const u=users.find(x=>x.id==id),c=codeOf(u);$('#root').insertAdjacentHTML('beforeend',`<div class="ov" id="ov"><div class="md" style="max-width:360px"><div id="idk" style="background:#fff;color:#1b2430;border-radius:14px;overflow:hidden;border:1px solid #ccc"><div style="background:${cfg.color};color:${tc(cfg.color)};padding:10px;text-align:center">${cfg.logo?`<img src="${cfg.logo}" height="44" style="background:#fff;border-radius:8px;padding:2px"><br>`:''}<b>${e(cfg.name)}</b><div style="font-size:11px">KARTU IDENTITAS PEGAWAI</div></div><div style="height:6px;background:#ffcc00"></div><div style="text-align:center;padding:12px">${u.foto?`<img src="${u.foto}" style="width:110px;height:140px;object-fit:cover;border-radius:10px;border:3px solid #208a8a">`:'<div style="font-size:70px">👤</div>'}<h3 style="margin:8px 0 0">${e(u.nama)}</h3><div>${e(u.jabatan||u.role)}</div><small>${e(u.bagian||'')}</small><div style="margin:4px 0 8px"><b>NIP: ${e(u.nip||'-')}</b></div>${bar(c)}<small>${c}</small></div></div><div class="tb" style="margin-top:10px"><button onclick="idj()">Unduh JPG</button><button class="g" onclick="$('#ov').remove()">Tutup</button></div></div></div>`)}
async function idj(){const c=await html2canvas($('#idk'),{scale:2});c.toBlob(b=>save('id-card.jpg',b),'image/jpeg',.92)}
function pimg(k,inp){const fl=inp.files[0];if(!fl)return;const im=new Image(),rd=new FileReader();rd.onload=()=>{im.onload=()=>{const c=document.createElement('canvas'),w=240,h=Math.round(im.height*w/im.width);c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);const v=c.toDataURL('image/jpeg',.8);$('#f_'+k).value=v;const p=$('#pv_'+k);p.src=v;p.style.display=''};im.src=rd.result};rd.readAsDataURL(fl)}
let mo=0,cfu='Semua';
function calG(ev,lab,col){const n=new Date();n.setDate(1);n.setMonth(n.getMonth()+mo);const y=n.getFullYear(),m=n.getMonth(),f=new Date(y,m,1).getDay(),dm=new Date(y,m+1,0).getDate();let h=`<div class="cd"><div class="tb"><button class="g" onclick="mo--;tab()">‹</button><b style="flex:1;text-align:center">${n.toLocaleString('id-ID',{month:'long',year:'numeric'})}</b><button class="g" onclick="mo++;tab()">›</button></div><div class="cl">`+['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="border:0;background:none"></div>'.repeat(f);for(let i=1;i<=dm;i++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;h+=`<div>${i}${ev.filter(x=>x.tanggal==ds).map(x=>{const c=col(x);return`<i style="background:${c};color:${tc(c)}">${e(lab(x))}</i>`}).join('')}</div>`}return h+'</div></div>'}
function lg_(o){return`<div class="tb">${Object.entries(o).map(([k,c])=>`<span class="tg" style="background:${c};color:${tc(c)};border-color:${c}">${k}</span>`).join('')}</div>`}
function kalx(){const ev=getD(L).filter(r=>cfu=='Semua'||r.unit==cfu);return`<div class="tb">${['Semua','KB','TK','SD','SMP','SIT'].map(u=>`<button class="s ${u==cfu?'':'g'}" style="${UC[u]?`border-color:${UC[u]}`:''}" onclick="cfu='${u}';tab()">${u}</button>`).join('')}</div>`+calG(ev,r=>(r.unit?r.unit+': ':'')+r.kegiatan,r=>UC[r.unit]||'#208a8a')+lg_(UC)}
function cpx(){return calG(getD(L),r=>r.judul+(r.platform?' · '+r.platform:''),r=>SC2[r.status]||'#208a8a')+lg_(SC2)}
function kasx(){const d=getD(L),i=sm_(d,'Pemasukan'),o=sm_(d,'Pengeluaran'),f=n=>'Rp '+n.toLocaleString('id-ID');return`<div class="gr"><div class="cd kp"><b>${f(i)}</b><span>Total pemasukan</span></div><div class="cd kp"><b>${f(o)}</b><span>Total pengeluaran</span></div><div class="cd kp"><b>${f(i-o)}</b><span>Saldo kas</span></div></div>`}
function kpx(){const k=KP.find(x=>'kpiict_'+slug(x[0])==L.id);return k?`<div class="cd" style="border-left:5px solid var(--ac)"><b>Tugas Pokok & Fungsi (Tupoksi)</b><p>${e(k[1])}</p></div>`:''}
const capp=()=>isA()&&(!L.dir||me.role=='Direktur'),waNum=n=>{n=String(n).replace(/\D/g,'');return n.startsWith('0')?'62'+n.slice(1):n};
const recOf=to=>to=='*'?users:to=='@admin'?users.filter(u=>u.role!='Staf'):to=='@dir'?users.filter(u=>u.role=='Direktur'):users.filter(u=>u.nama==to);
function waPrompt(to,text){const r=recOf(to).filter(u=>u.wa&&u.id!=me.id);if(!r.length||$('#ow'))return;window._wt=text;$('#root').insertAdjacentHTML('beforeend',`<div class="ov" id="ow"><div class="md"><h3>📲 Kirim pemberitahuan ke WhatsApp</h3><p>${e(text)}</p>${r.map(u=>`<div class="tb"><span style="flex:1">${e(u.nama)}</span><button onclick="nwb('${u.id}',this)">Kirim WA</button></div>`).join('')}<button class="g" onclick="$('#ow').remove()">Tutup</button></div></div>`)}
function nwb(id,b){const u=users.find(x=>x.id==id);open_('https://wa.me/'+waNum(u.wa)+'?text='+encodeURIComponent(`[${cfg.name}] ${window._wt}`));b.textContent='Terkirim ✓';b.disabled=true}
const fj=v=>{try{return JSON.parse(v)}catch(x){return null}},fnm=v=>(fj(v)||{}).n||'';
function pfile(k,inp){const fl=inp.files[0];if(!fl)return;if(fl.size>1500000){inp.value='';return alert('Ukuran file maksimal 1,5 MB (versi lokal). Versi Supabase mendukung file lebih besar.')}const rd=new FileReader();rd.onload=()=>{$('#f_'+k).value=JSON.stringify({n:fl.name,d:rd.result});$('#pv_'+k).textContent=fl.name};rd.readAsDataURL(fl)}
async function dlf(id,k){const r=getD(L).find(x=>x.id==id),o=fj(r[k]);if(!o)return;const b=atob(o.d.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);save(o.n,new Blob([a],{type:o.d.slice(5,o.d.indexOf(';'))}))}
const MV=()=>LS.g('mov',{}),nm=i=>(MV()[i.id||slug(i.t)]||{}).t||i.t;let mei=null;
function mvh(){const ov=MV();return`<div class="cd"><b>Menu Bawaan</b><p class="mu">Ubah nama atau sembunyikan menu.</p>${MENU.filter(g=>g.g!='Menu Kustom').flatMap(g=>g.i).filter(i=>!i.set&&i.id!='dash').map(i=>{const k=i.id||slug(i.t),o=ov[k]||{};return`<div class="tb"><input class="mvn" data-k="${k}" value="${e(o.t||i.t)}"><label style="white-space:nowrap"><input type="checkbox" class="mvh" data-k="${k}" style="width:auto;min-height:0" ${o.h?'':'checked'}> tampil</label></div>`}).join('')}<button onclick="svMv()">Simpan Menu Bawaan</button></div>`}
function svMv(){const o={};document.querySelectorAll('.mvn').forEach(x=>{const k=x.dataset.k;o[k]={t:x.value.trim(),h:!document.querySelector('.mvh[data-k="'+k+'"]').checked}});LS.s('mov',o);shell();go('set')}
function edM(i){const c=CM()[i];$('#m_t').value=c.t;$('#m_i').value=c.ic||'';$('#m_f').value=c.f;mei=i;$('#m_b').textContent='Simpan Perubahan';$('#m_t').focus()}
function mkh(){return`<div class="cd"><b>Menu Kustom</b><p class="mu">Tambah menu baru (tabel data lengkap dengan tambah, edit, impor, export).</p><div class="tb"><input id="m_t" placeholder="Nama menu"><input id="m_i" placeholder="Ikon (emoji)" style="max-width:120px"></div><div class="fl"><input id="m_f" placeholder="Kolom: tanggal:date,judul,status:select(Baru|Selesai)"></div><p class="mu">Tipe kolom: text, date, time, month, number, url, area, select(a|b), user, img.</p><button id="m_b" onclick="addM()">Tambah Menu</button>${CM().map((c,i)=>`<div class="tb"><span style="flex:1">${c.ic||'📁'} ${e(c.t)}</span><button class="s g" onclick="edM(${i})">Edit</button><button class="s g" onclick="delM(${i})">Hapus</button></div>`).join('')}</div>`}
function addM(){const t=$('#m_t').value.trim();if(!t)return alert('Isi nama menu');const a=CM(),ic=$('#m_i').value.trim()||'📁',f=$('#m_f').value.trim()||'tanggal:date,judul,keterangan:area';if(mei!=null){a[mei]={...a[mei],t,ic,f};mei=null}else a.push({id:'cm_'+slug(t)+uid().slice(0,3),t,ic,f});LS.s('cmenu',a);syncCM();shell();go('set')}
function delM(i){if(!confirm('Hapus menu ini dari navigasi?'))return;const a=CM();a.splice(i,1);LS.s('cmenu',a);syncCM();shell();go('set')}
function chat(){const rooms=['Grup Umum','Grup Manajemen',...users.filter(u=>u.id!=me.id).map(u=>u.nama)];window.rm=window.rm||rooms[0];const key=r=>r.startsWith('Grup')?r:[me.nama,r].sort().join('|'),ms=LS.g('chat',[]).filter(m=>m.r==key(rm));
$('#pg').innerHTML=`<h2>Chat Personal & Grup</h2><div class="cd"><select onchange="rm=this.value;chat()">${rooms.map(r=>`<option ${r==rm?'selected':''}>${e(r)}</option>`).join('')}</select><div class="ch" id="chb">${ms.map(m=>`<div class="ms ${m.f==me.nama?'me':''}"><small>${e(m.f)}</small><br>${e(m.x)}</div>`).join('')||'<span class="mu">Belum ada pesan.</span>'}</div><div class="tb"><input id="cm" placeholder="Tulis pesan…" onkeydown="if(event.key=='Enter')snd()"><button onclick="snd()">Kirim</button></div><p class="mu">Catatan: pesan tersimpan di perangkat ini (belum real-time lintas perangkat).</p></div>`;const b=$('#chb');b.scrollTop=b.scrollHeight;window.snd=()=>{const x=$('#cm').value.trim();if(!x)return;const a=LS.g('chat',[]);a.push({id:uid(),ts:Date.now(),r:key(rm),f:me.nama,x});LS.s('chat',a);chat()}}
function sett(){$('#pg').innerHTML=`<h2>Setting General</h2><div class="cd"><div class="fl"><label>Nama aplikasi</label><input id="s_n" value="${e(cfg.name)}"></div><div class="fl"><label>Warna dashboard</label><input id="s_c" type="color" value="${cfg.color}"></div><div class="tb"><small class="mu">Preset unit:</small><button class="s" style="background:#0c5b5b;color:#fff" onclick="$('#s_c').value='#0c5b5b'">SIT</button><button class="s" style="background:#ffa500;color:#1b2430" onclick="$('#s_c').value='#ffa500'">TK</button><button class="s" style="background:#86bd17;color:#1b2430" onclick="$('#s_c').value='#86bd17'">SD</button><button class="s" style="background:#78b9fa;color:#1b2430" onclick="$('#s_c').value='#78b9fa'">SMP</button></div><div class="fl"><label>Logo</label><input id="s_l" type="file" accept="image/*"></div><div class="tb"><div class="fl" style="flex:1"><label>Jam masuk</label><input id="s_i" type="time" value="${cfg.in}"></div><div class="fl" style="flex:1"><label>Jam pulang</label><input id="s_o" type="time" value="${cfg.out}"></div></div><label><input type="checkbox" id="s_w" style="width:auto" ${cfg.wa?'checked':''}> Aktifkan pemberitahuan WhatsApp (nomor diisi di Data Profile tiap pegawai)</label><p><button onclick="svS()">Simpan</button> <button class="g" onclick="go('profil')">Kelola User</button></p></div>${mkh()}${mvh()}`}
function svS(){const f=$('#s_l').files[0],fin=()=>{cfg={...cfg,name:$('#s_n').value,color:$('#s_c').value,in:$('#s_i').value,out:$('#s_o').value,wa:$('#s_w').checked};LS.s('cfg',cfg);theme();shell();go('set')};if(f){const r=new FileReader();r.onload=()=>{cfg.logo=r.result;fin()};r.readAsDataURL(f)}else fin()}
boot();
</script></body></html>
